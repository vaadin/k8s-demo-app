# Hazelcast is embedded in every app pod (Kubernetes Kit session replication).
# Members find each other through the Kubernetes API, so they need read access
# to endpoints/pods, and a Service that selects all app pods of every version.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-demo-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-demo-app-hazelcast
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "nodes", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-demo-app-hazelcast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-demo-app-hazelcast
subjects:
  - kind: ServiceAccount
    name: k8s-demo-app
    namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: hazelcast-service
spec:
  selector:
    app: k8s-demo-app
  ports:
    - name: hazelcast
      port: 5701
